services:
  admin-service-db:
    image: postgres
    container_name: admin-service-db
    environment:
      POSTGRES_DB: examinai-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5439:5432"
    volumes:
      - pgdata-admin-service:/var/lib/postgresql/data
    networks:
      - admin_net


  admin-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin-service
    depends_on:
      - admin-service-db
    ports:
      - "8083:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://admin-service-db:5432/examinai-db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      APPLICATION_REALM: ${APPLICATION_REALM}
      USER_SYNC_CLIENT_ID: ${USER_SYNC_CLIENT_ID}
      USER_SYNC_CLIENT_SECRET: ${USER_SYNC_CLIENT_SECRET}
      JWK_SET_URI: ${JWK_SET_URI}
      KEYCLOAK_HOST: http://keycloak:8080
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-false}
      EUREKA_URL: ${EUREKA_URL:-http://service-discovery:8761/eureka}
    networks:
      - admin_net
      - keycloak_net
      - app_net

  keycloak-db:
    image: postgres:15
    container_name: keycloak-postgres-admin-service
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5434:5432"
    volumes:
      - keycloak_pgdata_admin_service:/var/lib/postgresql/data
    networks:
      - keycloak_net

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9091:8080"
    depends_on:
      - keycloak-db
    volumes:
      - ./keycloak/realm-config:/opt/keycloak/data/import
    networks:
      - keycloak_net

volumes:
  pgdata-admin-service:
  keycloak_pgdata_admin_service:

networks:
  admin_net:
  keycloak_net:
  app_net:
    external: true